name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
      - name: Criar Android
        run: |
          flutter create --org com.edutv.vault --project-name edutv_vault --platforms=android temp_fix
          rm -rf android
          mv temp_fix/android./android
          rm -rf temp_fix
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: edutv-vault-apk
          path: build/app/outputs/flutter-apk/app-release.apk
