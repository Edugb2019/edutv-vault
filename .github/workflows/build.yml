name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
      - name: Criar pasta Android
        run: |
          flutter create --project-name edutv_vault --org com.edutv.vault --platforms=android temp_app
          cp -r temp_app/android./
          rm -rf temp_app
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: edutv-vault-apk
          path: build/app/outputs/flutter-apk/app-release.apk
